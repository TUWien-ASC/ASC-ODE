# Builds the documentation in docs/ with Jupyter Book 2 and publishes it on GitHub Pages.
# Once per repository: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# In a fork, also enable workflows in the Actions tab.

name: Documentation
on:
  push:
    branches: [main]
  workflow_dispatch:     # allows to start it by hand in the Actions tab

env:
  # the site is served from https://<user>.github.io/<repository-name>
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install Jupyter Book
        run: npm install -g jupyter-book
      - name: Build HTML
        run: jupyter-book build --html --strict
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs/_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
